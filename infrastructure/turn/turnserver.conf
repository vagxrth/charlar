# ─── Listening ────────────────────────────────────────────────────────────────
listening-port=3478
# tls-listening-port=5349  # uncomment after adding TLS certs
listening-ip=${TURN_LISTENING_IP}

# ─── External IP (required behind NAT) ───────────────────────────────────────
# Maps the public IP to the private/listening IP so relay candidates carry the
# correct address. On a host with a directly assigned public IP, set both to
# the same value. Both are resolved by docker-entrypoint.sh, which falls back
# to the cloud metadata server when they are left blank in turn/.env.
external-ip=${TURN_EXTERNAL_IP}/${TURN_LISTENING_IP}

# ─── Relay port range ────────────────────────────────────────────────────────
# 16 384 ports → ~8k concurrent media sessions
min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}

# ─── Authentication ──────────────────────────────────────────────────────────
# TURN REST API (RFC draft) — the shared secret MUST match the backend's
# TURN_SECRET so that HMAC-SHA1 ephemeral credentials validate.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# ─── Realm ───────────────────────────────────────────────────────────────────
realm=${TURN_REALM}

# ─── TLS (TURNS on port 5349) ───────────────────────────────────────────────
# Disabled by default — enable by mounting certs and removing no-tls below.
# See infrastructure/turn/README.md for Let's Encrypt setup instructions.
no-tls
# cert=${TURN_TLS_CERT}
# pkey=${TURN_TLS_KEY}

# ─── Security hardening ─────────────────────────────────────────────────────
fingerprint
stale-nonce=600
no-multicast-peers
no-cli
# Browsers only allocate UDP relays, so TCP relay (RFC 6062) serves no client.
no-tcp-relay

# Block relay to RFC 1918 / RFC 6598 private ranges — prevents using TURN as a
# network pivot into internal infrastructure.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255

# Block the remaining special-use ranges too: "this network", loopback,
# link-local, protocol assignments, documentation, benchmarking and reserved.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# ─── Logging (container-friendly) ───────────────────────────────────────────
log-file=stdout
verbose

# ─── Capacity ────────────────────────────────────────────────────────────────
# total-quota: maximum concurrent relay allocations across the whole server
# (NOT a bandwidth limit). Each relayed call uses one allocation per peer.
total-quota=100
# Per-credential cap on concurrent allocations, and a per-allocation bandwidth
# cap in bytes/s (500000 ≈ 4 Mbit/s each way, ample for a 720p call).
user-quota=12
max-bps=500000
# Whole-server bandwidth cap; 0 = unlimited.
bps-capacity=0
